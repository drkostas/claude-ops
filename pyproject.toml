[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-ops"
version = "0.1.0"
description = "Tools for running many Claude Code chats on one machine: find any chat, send a message into a running one, start chats in tmux, wake a chat from a scheduled job, and a few hooks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = []
keywords = ["claude", "claude-code", "iterm2", "tmux", "hooks", "skills", "automation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Topic :: Utilities"]

[project.urls]
Homepage = "https://github.com/drkostas/claude-ops"

[project.scripts]
claude-ops = "claude_ops.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_ops = ["skills/*/SKILL.md", "rover/*.sh", "rover/*.plist", "rover/*.example"]
