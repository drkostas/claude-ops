name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9, which the package still supports
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: pytest -q
      # --hosted-only because this repository is public, so every job of it belongs on a runner
      # GitHub hosts. It runs here rather than in fork-guard.yml, whose install is pinned to the
      # commit that added that check and so does not know this flag yet.
      - run: claude-ops fork-guard .github/workflows --hosted-only
      - run: bash -n src/claude_ops/rover/harness.sh && bash -n src/claude_ops/rover/netwatchdog.sh

  look:
    # the look tests open pages in Chromium, which the test job above does not install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,look]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_look.py
