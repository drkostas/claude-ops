name: Fork guard
# Fail a pull request that adds a scheduled or workflow_dispatch job which acts on this repository's
# issues, pull requests or comments without an `if: github.repository == 'owner/name'` guard. Such a
# job runs in every fork too, where it acts on the wrong repository or fails because the fork turned
# issues off. The check is the claude-ops fork-guard lint.
on: pull_request
permissions:
  contents: read
jobs:
  fork-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The pin names a commit of the lint, and a repository moves it when it needs a newer check.
      # This one knows --hosted-only, which the commit this file used to pin does not.
      - run: pip install "claude-ops[yaml] @ git+https://github.com/drkostas/claude-ops@f6af86ea5cd08d1a26d25bd809fa69b2dfe42712"
      # --hosted-only because this repository is public, so every job of it belongs on a runner
      # GitHub hosts. The repository's own CI runs the same lint from the working tree as well.
      - run: claude-ops fork-guard .github/workflows --hosted-only
